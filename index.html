<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vello</title>
<style>
body{background:#0a0f1c;color:#fff;font-family:sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;height:100vh}
h1{margin:0 0 20px 0}
#box{width:100%;max-width:500px;background:#111a2b;border:1px solid #1f2a44;border-radius:12px;padding:15px;height:60vh;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;margin-bottom:10px}
.me{background:#2563eb;padding:10px;border-radius:10px;margin:8px 0;max-width:80%;margin-left:auto}
.ai{background:#1f2a44;padding:10px;border-radius:10px;margin:8px 0;max-width:80%}
.warn{background:#332200;color:#ffb700;padding:10px;border-radius:8px;margin:8px 0;display:flex;gap:8px;align-items:center}
#input{display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:8px;border:0;background:#0a0f1c;color:#fff}
button{padding:12px 20px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-weight:bold}
#top{display:flex;width:100%;max-width:500px;justify-content:space-between;align-items:center;margin-bottom:10px}
#gear{font-size:24px;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;justify-content:center;align-items:center}
.modal>div{background:#111a2b;padding:20px;border-radius:12px;width:90%;max-width:400px}
.modal input{width:100%;margin:10px 0}
</style>
</head>
<body>
<div id="top"><h1>Vello</h1><div id="gear">⚙️</div></div>
<div id="box">
  <div id="chat"></div>
  <div id="input">
    <input id="txt" placeholder="Ask Vello anything...">
    <button id="send">Send</button>
  </div>
</div>

<div class="modal" id="settings">
  <div>
    <h3>Settings</h3>
    <input id="key" placeholder="Paste your gsk_... Groq key">
    <button id="save">Save</button>
    <button id="close">Close</button>
  </div>
</div>

<script>
const chat=document.getElementById('chat');
const txt=document.getElementById('txt');
const send=document.getElementById('send');
const gear=document.getElementById('gear');
const modal=document.getElementById('settings');
const keyInput=document.getElementById('key');
const saveBtn=document.getElementById('save');
const closeBtn=document.getElementById('close');

let KEY=localStorage.getItem('vello_key')||'';

function add(t,w){chat.innerHTML+=`<div class="${w}">${t}</div>`;chat.scrollTop=chat.scrollHeight;}

function checkKey(){
  if(!KEY){
    add('⚠️ Add Groq key in Settings ⚙️','warn');
  }
}
checkKey();

async function ask(){
  let m=txt.value;if(!m)return;
  if(!KEY){add('⚠️ Add Groq key in Settings ⚙️','warn');return;}
  add(m,'me');txt.value='';
  let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({model:'llama3-8b-8192',messages:[{role:'user',content:m}]})
  });
  if(!r.ok){add('Groq error','ai');return;}
  let j=await r.json();
  add(j.choices[0].message.content,'ai');
}
send.onclick=ask;
txt.onkeydown=e=>e.key==='Enter'&&ask();

gear.onclick=()=>{modal.style.display='flex';keyInput.value=KEY;}
closeBtn.onclick=()=>modal.style.display='none';
saveBtn.onclick=()=>{KEY=keyInput.value;localStorage.setItem('vello_key',KEY);modal.style.display='none';chat.innerHTML='';checkKey();}
</script>
</body>
</html>
