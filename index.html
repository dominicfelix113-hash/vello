<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vello</title>
<style>
  body{background:#000;color:#fff;font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
  #chat{flex:1;overflow:auto;padding:10px}
 .me{text-align:right;margin:6px 0}
 .ai{text-align:left;margin:6px 0;color:#aaa}
  #bar{display:flex;padding:10px;gap:8px;border-top:1px solid #222}
  input{flex:1;padding:12px;border-radius:20px;border:0;background:#111;color:#fff}
  button{padding:12px 16px;border:0;border-radius:20px;background:#222;color:#fff;font-size:18px}
</style>
</head>
<body>
<div id="chat"></div>
<div id="bar">
  <button id="mic">🎤</button>
  <input id="txt" placeholder="Talk to Vello...">
  <button id="send">➤</button>
</div>
<script>
// ======= PASTE YOUR NEW GSK KEY HERE ONLY =======
const KEY = 'PASTE_YOUR_NEW_GSK_KEY_HERE';
// ================================================

const chat = document.getElementById('chat');
const txt = document.getElementById('txt');
const mic = document.getElementById('mic');
const send = document.getElementById('send');
const speak = t => speechSynthesis.speak(new SpeechSynthesisUtterance(t));
const add = (t,w) => {chat.innerHTML += `<div class="${w}">${t}</div>`; chat.scrollTop=chat.scrollHeight;}

async function ask() {
  let msg = txt.value; if(!msg) return;
  add(msg,'me'); txt.value='';
  try{
    let r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'user',content:msg}]})
    });
    let j = await r.json();
    let reply = j.choices[0].message.content;
    add(reply,'ai'); speak(reply);
  }catch(e){ add('Key Error. Check it.','ai'); }
}
send.onclick=ask;
txt.onkeydown=e=>e.key==='Enter'&&ask();
const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='en-NG';
mic.onclick=()=>rec.start();
rec.onresult=e=>{txt.value=e.results[0][0].transcript;ask();}
</script>
</body>
</html>
