

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vello AI</title>
<style>
  body{margin:0;font-family:sans-serif;background:#0b1220;color:#e6eef8;display:flex;flex-direction:column;height:100vh}
  header{padding:12px;text-align:center;font-weight:800;font-size:20px;border-bottom:1px solid #1f2937}
  #chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;max-width:80%}
.user{align-self:flex-end;background:#2563eb}
.ai{align-self:flex-start;background:#1f2937}
.ai img{max-width:100%;border-radius:8px;margin-top:6px}
  footer{display:flex;gap:6px;padding:10px;border-top:1px solid #1f2937;background:#0b1220}
  input{flex:1;padding:10px;border-radius:10px;border:1px solid #374151;background:#111827;color:#e6eef8}
  button{padding:10px 12px;border:none;border-radius:10px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>Vello</header>
<div id="chat"></div>
<footer>
  <button id="micBtn" title="Voice">🎤</button>
  <button id="imgBtn" title="Upload Pic">📷</button>
  <input id="input" placeholder="Ask Vello anything...">
  <button id="sendBtn">Send</button>
  <button id="speakBtn" title="Speak">🔊</button>
</footer>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
// ======= ONLY CHANGE THIS 1 LINE =======
const GROQ_API_KEY = gsk-Y2tSgznpQInk4q2nG3qLWGdyb3fYXNdJfzEaLZFrGvOyh1X2BSPc
// =======================================

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const speakBtn = document.getElementById('speakBtn');
const imgBtn = document.getElementById('imgBtn');
const fileInput = document.getElementById('fileInput');
let imageBase64 = null;

function addMsg(text, who, img=null){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerText = text;
  if(img){
    const im = document.createElement('img');
    im.src = img;
    div.appendChild(im);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function askVello() {
  const text = input.value.trim();
  if(!text &&!imageBase64) return;
  addMsg(text || 'Sent an image', 'user');
  input.value = '';
  const messages = [{role:'user', content: imageBase64? [{type:'text', text:text || 'What is this?'},{type:'image_url', image_url:{url:imageBase64}}] : text }];
  if(text.toLowerCase().includes('draw')){
    const prompt = text.replace(/draw/gi,'').trim();
    addMsg('Here you go:', 'ai', `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512`);
    imageBase64 = null; return;
  }
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+GROQ_API_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({model: 'meta-llama/llama-4-scout-17b-16e-instruct', messages: messages})
    });
    const data = await res.json();
    const reply = data.choices[0].message.content;
    addMsg(reply, 'ai');
    speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
  }catch(e){ addMsg('Error: Key is wrong or missing', 'ai'); }
  imageBase64 = null;
}

sendBtn.onclick = askVello;
input.onkeydown = e => e.key==='Enter' && askVello();
const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='en-NG';
micBtn.onclick=()=>rec.start();
rec.onresult=e=>{input.value=e.results[0][0].transcript; askVello();}
speakBtn.onclick=()=>{ const lastAi = [...chat.querySelectorAll('.ai')].pop(); if(lastAi) speechSynthesis.speak(new SpeechSynthesisUtterance(lastAi.innerText)); }
imgBtn.onclick=()=>fileInput.click();
fileInput.onchange=e=>{ const file=e.target.files[0]; const reader=new FileReader(); reader.onload=()=>{imageBase64=reader.result; input.placeholder='Image added. Ask about it...';} reader.readAsDataURL(file); }
</script>
</body>
</html>
