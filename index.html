<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vello</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;height:100vh;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:10px}
.me{margin:8px 0;text-align:right}
.ai{margin:8px 0;text-align:left;color:#0f0}
#input{display:flex;padding:10px;gap:8px}
input{flex:1;padding:12px;border-radius:20px;border:0;background:#111;color:#fff}
button{padding:12px;border-radius:20px;border:0;background:#222;color:#fff}
</style>
</head>
<body>
<div id="chat"></div>
<div id="input">
<button id="mic">🎤</button>
<input id="txt" placeholder="Talk to Vello...">
<button id="send">➤</button>
</div>
<script>
const KEY='gsk_PASTE_YOUR_GROQ_KEY_HERE'; // <-- PASTE YOUR gsk_... KEY HERE ONLY
const chat=document.getElementById('chat');
const txt=document.getElementById('txt');
const mic=document.getElementById('mic');
const send=document.getElementById('send');
const speak=t=>speechSynthesis.speak(new SpeechSynthesisUtterance(t));
const add=(t,w)=>{chat.innerHTML+=`<div class="${w}">${t}</div>`;chat.scrollTop=chat.scrollHeight;}
async function ask(){
 let m=txt.value;if(!m)return;add(m,'me');txt.value='';
 let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{ // <-- GROQ URL
  method:'POST',
  headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
  body:JSON.stringify({model:'llama3-8b-8192',messages:[{role:'user',content:m}]}) // <-- GROQ MODEL
 });
 if(!r.ok){add('Groq error','ai');return;}
 let j=await r.json();
 let reply=j.choices[0].message.content;
 add(reply,'ai');speak(reply);
}
send.onclick=ask;
txt.onkeydown=e=>e.key==='Enter'&&ask();
const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='en-NG';
mic.onclick=()=>rec.start();
rec.onresult=e=>{txt.value=e.results[0][0].transcript;ask();}
</script>
</body>
</html>
