
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vello AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:#1e293b;
}

header h1{
    color:#38bdf8;
}

.container{
    max-width:800px;
    margin:30px auto;
    padding:20px;
}

.chat-box{
    background:#1e293b;
    height:400px;
    border-radius:12px;
    padding:15px;
    overflow-y:auto;
}

.message{
    margin:12px 0;
    padding:10px;
    border-radius:10px;
}

.bot{
    background:#334155;
}

.user{
    background:#2563eb;
    text-align:right;
}

.input-area{
    display:flex;
    margin-top:15px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px 0 0 10px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    background:#38bdf8;
    color:white;
    font-size:16px;
    border-radius:0 10px 10px 0;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>Vello AI</h1>
<p>Your Smart AI Assistant</p>
</header>

<div class="container">

<div class="chat-box" id="chatBox">
<div class="message bot">
Hello! 👋 I'm Vello AI. Ask me anything.
</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Type your message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>
function sendMessage(){

const input=document.getElementById("userInput");
const chat=document.getElementById("chatBox");

if(input.value.trim()=="") return;

chat.innerHTML+=`
<div class="message user">${input.value}</div>
`;

const msg=input.value;

input.value="";

setTimeout(()=>{
chat.innerHTML+=`
<div class="message bot">
You said: ${msg}
</div>
`;
chat.scrollTop=chat.scrollHeight;
},500);

chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
